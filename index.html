<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Аттрактор — Документальный атлас РЭН</title>
<style>
html,body{height:100%;margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:#f4f6f8;color:#1d2733}
#loading{height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px}
.spinner{width:36px;height:36px;border:4px solid #d7dde4;border-top-color:#4B7188;border-radius:50%;animation:s .8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.small{font-size:13px;color:#687585}
</style>
</head>
<body>
<div id="loading"><div class="spinner"></div><div>Загрузка карты РЭН v203…</div><div class="small">Команда «Аттрактор»</div></div>
<script>
(async()=>{
 const files=["site_payload/v203/part-000.txt","site_payload/v203/part-001.txt","site_payload/v203/part-002.txt","site_payload/v203/part-003.txt","site_payload/v203/part-004.txt","site_payload/v203/part-005.txt","site_payload/v203/part-006.txt","site_payload/v203/part-007.txt","site_payload/v203/part-008.txt","site_payload/v203/part-009.txt","site_payload/v203/part-010.txt","site_payload/v203/part-011.txt","site_payload/v203/part-012.txt","site_payload/v203/part-013.txt","site_payload/v203/part-014.txt","site_payload/v203/part-015.txt","site_payload/v203/part-016.txt","site_payload/v203/part-017.txt"];
 try{
   const parts=[];
   for(const f of files){
     const r=await fetch(f+"?v=203-wip-20261004",{cache:"no-cache"});
     if(!r.ok) throw new Error(f+" — HTTP "+r.status);
     parts.push(await r.text());
   }
   let html=parts.join("");
   html=html.replace('<button type="button" class="okur-wip-top" disabled aria-disabled="true">Схема связи ОКУР <span>на доработке</span></button>', '<button type="button" data-open-okur>Слой ОКУР</button>');
   html=html.replace('<div class="okur-wip-card" aria-label="Схема связи ОКУР — на доработке"><strong>Схема связи ОКУР</strong><span>на доработке</span></div>', '<button type="button" data-open-okur>Слой ОКУР · 87 участников</button>');
   html=html.replace('</head>', '<link rel="stylesheet" href="okur/atlas-layer.css?v=okur-7"></head>');
   html=html.replace('</body>', '<script src="okur/domains-graph.js?v=okur-7"><'+'/script><script src="okur/atlas-layer.js?v=okur-7"><'+'/script></body>');
   document.open();
   document.write(html);
   document.close();
 }catch(e){
   const el=document.getElementById("loading");
   if(el) el.innerHTML="<b>Не удалось загрузить карту.</b><div class='small'>"+String(e)+"</div>";
 }
})();
</script>
</body>
</html>
